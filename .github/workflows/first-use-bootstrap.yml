name: First use bootstrap

on:
  workflow_dispatch:
    inputs:
      harness_resource_group:
        description: Resource group name for Azure Harness agent infrastructure
        required: true
        default: rg-sdlcdocs-harness
        type: string
      sample_app_resource_group:
        description: Resource group name for sample app resources
        required: true
        default: rg-sdlcdocs-sample-app
        type: string
      location:
        description: Azure region
        required: true
        default: australiaeast
        type: string
      orchestrator_image:
        description: Orchestrator container image
        required: true
        default: ghcr.io/ozbobdev/orchestrator:latest
        type: string
      bdd_agent_image:
        description: BDD agent container image
        required: true
        default: ghcr.io/ozbobdev/bdd-agent:latest
        type: string
      terraform_apply:
        description: Apply terraform after plan
        required: true
        default: true
        type: boolean

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
          TF_BACKEND_STORAGE_ACCOUNT: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
          AZURE_HARNESS_API_KEY: ${{ secrets.AZURE_HARNESS_API_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            TF_BACKEND_RESOURCE_GROUP
            TF_BACKEND_STORAGE_ACCOUNT
            TF_BACKEND_CONTAINER
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo >&2
            echo "Create secrets with GitHub CLI:" >&2
            for name in "${missing[@]}"; do
              echo "gh secret set ${name}" >&2
            done
            exit 1
          fi

          echo "Required secrets are set."

          optional=(AZURE_HARNESS_API_KEY AZURE_STORAGE_CONNECTION_STRING AZURE_KEYVAULT_NAME)
          for name in "${optional[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Optional secret not set: ${name}"
            fi
          done

  deploy-harness:
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Ensure target resource groups exist
        run: |
          az group create --name "${{ inputs.harness_resource_group }}" --location "${{ inputs.location }}"
          az group create --name "${{ inputs.sample_app_resource_group }}" --location "${{ inputs.location }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: azure-harness/infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ github.repository }}-${{ github.ref_name }}.tfstate"

      - name: Terraform plan
        working-directory: azure-harness/infra
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="resource_group_name=${{ inputs.harness_resource_group }}" \
            -var="location=${{ inputs.location }}" \
            -var="orchestrator_image=${{ inputs.orchestrator_image }}" \
            -var="bdd_agent_image=${{ inputs.bdd_agent_image }}" \
            -out=tfplan

      - name: Terraform apply
        if: ${{ fromJSON(inputs.terraform_apply) }}
        working-directory: azure-harness/infra
        run: terraform apply -auto-approve tfplan
