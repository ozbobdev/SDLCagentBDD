name: Deploy Azure Harness

on:
  pull_request:
    paths:
      - "azure-harness/**"
  workflow_dispatch:
    inputs:
      location:
        description: "Azure location"
        required: false
        default: "WestUS2"

permissions:
  actions: write
  id-token: write
  contents: read

env:
  LOCATION: ${{ github.event.inputs.location || 'WestUS2' }}
  HARNESS_RG: rg-sdlcdocs-harness
  TF_BACKEND_RG: rg-sdlcdocs-tfstate
  TF_BACKEND_STORAGE: sdlcdocstfstate001
  TF_BACKEND_CONTAINER: tfstate
  TF_STATE_KEY: sdlcdocs.tfstate
  KV_NAME: kv-sdlcdocs-harness
  ORCHESTRATOR_IMAGE: ghcr.io/ozbobdev/orchestrator:latest
  BDD_AGENT_IMAGE: ghcr.io/ozbobdev/bdd-agent:latest
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-azure-harness
    defaults:
      run:
        shell: bash
        working-directory: azure-harness/infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RG" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"

      - name: Import existing resource group if not in state
        run: |
          if [ "$(az group exists --name "$HARNESS_RG")" = "true" ] && \
             ! terraform state list | grep -qx "azurerm_resource_group.agents"; then
            terraform import -input=false \
              -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
              -var="tenant_id=$ARM_TENANT_ID" \
              -var="resource_group_name=$HARNESS_RG" \
              -var="location=$LOCATION" \
              -var="orchestrator_image=$ORCHESTRATOR_IMAGE" \
              -var="bdd_agent_image=$BDD_AGENT_IMAGE" \
              azurerm_resource_group.agents "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$HARNESS_RG"
          fi

      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="resource_group_name=$HARNESS_RG" \
            -var="location=$LOCATION" \
            -var="orchestrator_image=$ORCHESTRATOR_IMAGE" \
            -var="bdd_agent_image=$BDD_AGENT_IMAGE" \
            -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Ensure Key Vault and access role
        run: |
          if [ "$(az keyvault list --resource-group "$HARNESS_RG" --query "[?name=='$KV_NAME'] | length(@)" -o tsv)" = "0" ]; then
            az keyvault create --name "$KV_NAME" --resource-group "$HARNESS_RG" --location "$LOCATION" --enable-rbac-authorization true >/dev/null
          fi
          KV_ID=$(az keyvault show --name "$KV_NAME" --resource-group "$HARNESS_RG" --query id -o tsv)
          CALLER=$(az account show --query user.name -o tsv)
          COUNT=$(az role assignment list --assignee "$CALLER" --scope "$KV_ID" --role "Key Vault Secrets Officer" --query "length(@)" -o tsv)
          if [ "$COUNT" = "0" ]; then
            az role assignment create --assignee "$CALLER" --role "Key Vault Secrets Officer" --scope "$KV_ID" >/dev/null
            sleep 30
          fi

      - name: Ensure harness API key secret
        run: |
          if ! az keyvault secret show --vault-name "$KV_NAME" --name harness-api-key >/dev/null 2>&1; then
            KEY=$(terraform output -json | jq -r '.harness_api_key.value // empty')
            [ -n "$KEY" ] || KEY=$(openssl rand -hex 16)
            echo "::add-mask::$KEY"
            az keyvault secret set --vault-name "$KV_NAME" --name harness-api-key --value "$KEY" >/dev/null
          fi

      - name: Store deployment outputs as GitHub secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=$(az keyvault secret show --vault-name "$KV_NAME" --name harness-api-key --query value -o tsv)
          STORAGE_CONNECTION_STRING=$(az storage account show-connection-string \
            --name "$TF_BACKEND_STORAGE" \
            --resource-group "$TF_BACKEND_RG" \
            --query connectionString -o tsv)
          [ -n "$KEY" ] || { echo "Harness API key is empty" >&2; exit 1; }
          [ -n "$STORAGE_CONNECTION_STRING" ] || { echo "Storage connection string is empty" >&2; exit 1; }
          echo "::add-mask::$KEY"
          echo "::add-mask::$STORAGE_CONNECTION_STRING"
          printf '%s' "$KEY" | gh secret set AZURE_HARNESS_API_KEY --repo "$GITHUB_REPOSITORY"
          printf '%s' "$STORAGE_CONNECTION_STRING" | gh secret set AZURE_STORAGE_CONNECTION_STRING --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KV_NAME" | gh secret set AZURE_KEYVAULT_NAME --repo "$GITHUB_REPOSITORY"
