name: Deploy Azure Harness

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure location"
        required: false
        default: "australiaeast"

permissions:
  id-token: write
  contents: read

env:
  LOCATION: ${{ github.event.inputs.location || 'australiaeast' }}
  HARNESS_RG: rg-sdlcdocs-harness-aue
  TF_BACKEND_RG: rg-sdlcdocs-tfstate
  TF_BACKEND_STORAGE: sdlcdocstfstate001
  TF_BACKEND_CONTAINER: tfstate
  TF_STATE_KEY: sdlcdocs-prompt-agent.tfstate
  AI_SERVICES_ACCOUNT_NAME: aisdlcdocsharness001
  MODEL_DEPLOYMENT_NAME: gpt-4o-mini
  MODEL_NAME: gpt-4o-mini
  MODEL_VERSION: 2024-07-18
  MODEL_CAPACITY: 10
  MODEL_SKU_NAME: GlobalStandard
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-harness-deploy
    concurrency: deploy-azure-harness
    defaults:
      run:
        shell: bash
        working-directory: azure-harness/infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute globally unique Key Vault name
        run: echo "KV_NAME=kv-sdlcdocs-${ARM_SUBSCRIPTION_ID:0:8}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3

      - name: Register resource providers
        run: |
          for ns in Microsoft.CognitiveServices Microsoft.Storage Microsoft.KeyVault; do
            az provider register --namespace "$ns" --wait
          done

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TF_BACKEND_RG" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"

      - name: Import existing resource group if not in state
        run: |
          if [ "$(az group exists --name "$HARNESS_RG")" = "true" ] && \
             ! terraform state list | grep -qx "azurerm_resource_group.agents"; then
            terraform import -input=false \
              -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
              -var="tenant_id=$ARM_TENANT_ID" \
              -var="resource_group_name=$HARNESS_RG" \
              -var="location=$LOCATION" \
              -var="ai_services_account_name=$AI_SERVICES_ACCOUNT_NAME" \
              -var="model_deployment_name=$MODEL_DEPLOYMENT_NAME" \
              -var="model_name=$MODEL_NAME" \
              -var="model_version=$MODEL_VERSION" \
              -var="model_capacity=$MODEL_CAPACITY" \
              -var="model_sku_name=$MODEL_SKU_NAME" \
              azurerm_resource_group.agents "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$HARNESS_RG"
          fi

      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="resource_group_name=$HARNESS_RG" \
            -var="location=$LOCATION" \
            -var="ai_services_account_name=$AI_SERVICES_ACCOUNT_NAME" \
            -var="model_deployment_name=$MODEL_DEPLOYMENT_NAME" \
            -var="model_name=$MODEL_NAME" \
            -var="model_version=$MODEL_VERSION" \
            -var="model_capacity=$MODEL_CAPACITY" \
            -var="model_sku_name=$MODEL_SKU_NAME" \
            -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Ensure Key Vault and access role
        run: |
          if [ "$(az keyvault list --resource-group "$HARNESS_RG" --query "[?name=='$KV_NAME'] | length(@)" -o tsv)" = "0" ]; then
            az keyvault create --name "$KV_NAME" --resource-group "$HARNESS_RG" --location "$LOCATION" --enable-rbac-authorization true >/dev/null
          fi
          KV_ID=$(az keyvault show --name "$KV_NAME" --resource-group "$HARNESS_RG" --query id -o tsv)
          CALLER=$(az account show --query user.name -o tsv)
          COUNT=$(az role assignment list --assignee "$CALLER" --scope "$KV_ID" --role "Key Vault Secrets Officer" --query "length(@)" -o tsv)
          if [ "$COUNT" = "0" ]; then
            az role assignment create --assignee "$CALLER" --role "Key Vault Secrets Officer" --scope "$KV_ID" >/dev/null
            sleep 30
          fi

      - name: Store harness API key in Key Vault
        run: |
          KEY=$(terraform output -raw harness_api_key)
          ENDPOINT=$(terraform output -raw harness_endpoint)
          DEPLOYMENT=$(terraform output -raw model_deployment_name)
          [ -n "$KEY" ] || { echo "Harness API key output is empty" >&2; exit 1; }
          [ -n "$ENDPOINT" ] || { echo "Harness endpoint output is empty" >&2; exit 1; }
          [ -n "$DEPLOYMENT" ] || { echo "Model deployment output is empty" >&2; exit 1; }
          echo "::add-mask::$KEY"
          az keyvault secret set --vault-name "$KV_NAME" --name harness-api-key --value "$KEY" >/dev/null
          az keyvault secret set --vault-name "$KV_NAME" --name harness-endpoint --value "$ENDPOINT" >/dev/null
          az keyvault secret set --vault-name "$KV_NAME" --name harness-model-deployment --value "$DEPLOYMENT" >/dev/null

